engineering_guidance:
  standards:
    - "docs/standards/docs-governance.md"
    - "docs/standards/skill-source-layout.md"
  architecture_notes:
    - "Canonical completion-time home is E999 claim_evidence / not_claimed / remaining_gaps."
    - "goal.yaml and progress.yaml receive guidance only; do not add semantic_coverage_notes, proof_modality_by_path, not_in_scope, or another top-level field."
    - "Ready gate stays: stable goal contract plus authorized proof_step can produce or inspect completion.required_evidence within claim_limit."
    - "Semantic risk trigger makes claim coverage review mandatory only for broad, multi-stage, real-runtime, public-surface, authority-action, product-truth, quality, permission, destructive, compliance, multi-evidence, or relation-backed goals."
    - "Proof levels reuse the existing proof ladder and owner-local harness vocabulary."
    - "Future checker work is out of this first wave unless it is documented as structural and opt-in only."
  quality_bar: "A future agent reading only the phase skills, E999 template, checker-rules note, and Goal Proof README can apply Triggered Claim Coverage Review without inventing new schema, parser behavior, or token naming rules."
  preferred_proof_path: "Static diff inspection plus rg assertions, docs audit, Goal Pack check, git diff --check, and bun run check."

constraints:
  - "Do not change packages/cli/src/lib/goal-pack.ts or any CLI parser/checker behavior in W001."
  - "Do not introduce a new Goal Pack schema field or required YAML field."
  - "Do not add a global proof modality enum."
  - "Do not require every small Goal Pack to write a matrix."
  - "Do not enforce token naming conventions."
  - "Do not rename the existing Evidence Envelope Discipline or Harness Coverage Matrix concepts."
  - "Do not move current truth into the consumed source or review ledger; implementation guidance belongs in skills/templates/docs."

non_goals:
  - "No CLI semantic coverage checker in the first wave."
  - "No natural-language objective parser."
  - "No external project migration or runtime skill installation claim."
  - "No implementation of future opt-in structural lint."
  - "No change to Goal Pack ready formula."

completion:
  signal: "Goal Proof skills, E999 template, checker-rules note, and local Goal Proof docs present Triggered Claim Coverage Review as an existing-surface guidance/template change, with first-wave CLI/schema non-change boundaries explicit."
  required_evidence: "Skill guidance updated in goal-contracts, finding-proof-step, proof-step-implementation, and goal-proof-system; E999 template demonstrates claim coverage review using claim_evidence / not_claimed / remaining_gaps; checker-rules states first wave does not parse semantic coverage and future checker is structural opt-in only; docs/goal-proof README indexes the active Goal Pack and consumed source; static scan shows rejected field names are not active schema; packages/cli/src/lib/goal-pack.ts has no diff; bun run check, docs audit, goal-proof check for this pack, and git diff --check pass; completion review maps each claim slice to evidence with proof level and not_claimed / remaining_gaps."

claim_limit: "This Goal Pack may claim only repository-local Goal Proof method guidance, template, checker-rules documentation, and docs index updates for Triggered Claim Coverage Review. It does not claim CLI parser/checker behavior changes, new schema fields, external project migration, runtime skill promotion, natural-language semantic checking, or a future structural lint implementation."

stop_rules:
  - "Stop if implementation requires changing CLI parser, checker behavior, or package public API in W001."
  - "Stop if the guidance cannot be expressed without a new Goal Pack schema field."
  - "Stop if future checker wording would imply objective natural-language parsing or token naming enforcement."
  - "Stop if docs governance routes the adopted rule to SSoT, ADR, or standards instead of skill/template guidance."
  - "Stop if review ledger residual risks require reopening the adopted candidate."

agent_authority:
  continue_by_default: true
  requires_human_decision:
    - objective
    - authority_refs
    - engineering_guidance
    - constraints
    - completion
    - claim_limit
    - stop_rules
  agent_may_revise:
    - proof_step
    - work_order
    - proof_path
    - implementation_shape
    - documentation_shape

evidence_mode: strict
