intent:
  source: "docs/goal-proof/sources/2026-06-03-goal-contract-claim-coverage-review-proposal.md"
  interpreted_as: "Implement the reviewed Triggered Claim Coverage Review proposal as a Goal Proof method update across skills, templates, and local docs."
  assumptions:
    - "The plan-optimality ledger reached consensus and is the adopted implementation input."
    - "First wave is guidance/template/docs only and must not change CLI parser, checker behavior, or Goal Pack schema."
    - "Future checker work requires a separate reviewed proposal unless it remains structural and opt-in."
  open_questions: []

objective: "Add Triggered Claim Coverage Review to Goal Proof authoring, proof-step, run, and completion guidance so semantic-risk Goal Packs map claim slices to required evidence, evidence refs, proof level, and not_claimed / remaining_gaps without adding new schema fields or CLI semantic parsing."
guiding_principle: "Keep Goal Proof strong-agent optimistic: use existing v2 surfaces, make broad completion claims honest, and avoid a second workflow, second ledger, second contract, proof-level enum, or token naming DSL."

relations:
  thread_id: goal-proof-method
  links:
    - goal_id: 2026-05-24-goal-proof-v2-dogfood-migration
      relation: related_to
      evidence_ref: E999
      evidence:
        - completion_satisfied=true

authority_refs:
  - "docs/goal-proof/sources/2026-06-03-goal-contract-claim-coverage-review-proposal.md"
  - "docs/review-plan/runs/2026-06-03-goal-contract-semantic-coverage-gate-proposal-review.md"
