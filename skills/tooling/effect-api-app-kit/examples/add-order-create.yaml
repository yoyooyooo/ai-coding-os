schema_version: 1
change:
  id: add-order-create
  operation: add-slice
host:
  path: apps/api
  name: api
slice:
  module: orders
  subject: order
  operation: create
  pressure: P2
  persistence: postgres
  effect_profile: installed
http:
  enabled: true
  route: /orders
external_capability:
  name: risk-score
  provider: example-provider
verification:
  commands:
    - pnpm --filter api typecheck
    - pnpm --filter api test
