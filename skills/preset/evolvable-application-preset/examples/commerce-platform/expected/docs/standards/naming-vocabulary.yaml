schema_version: 1
preset_snapshot:
  id: evolvable-application
  version: 1.3.1-experimental.1
  profiles:
  - agent-entry
  - monorepo-core
  - typescript-node
  - react
  - effect
  - effect-httpapi-v4
  - verification-core
  - headless-product-harness
  - ui-product-harness
  note: Candidate owner-declared source-naming copy. Project Standards and SSoT own meaning only after explicit adoption; Suite files remain provenance, not dynamic inheritance.
contract_selection:
  term_owners:
  - effect-best-practices
  - frontend-architecture
  - product-harness-system
  extra_terms:
  - command
  - command-context
  - composition
  - contract
  - fake
  - idempotency
  - mapper
  - migration
  - policy
  - port
  - projection
  - public
  - query
  - repository
  - schema
  - transaction
  - use-case
  - wiring
  filename_pattern_owners:
  - effect-best-practices
  - evolvable-application-architecture
  - frontend-architecture
  guarded_terms:
  - accepted
  - adapter
  - api
  - authority
  - base
  - common
  - complete
  - contract
  - controller
  - core
  - done
  - e2e
  - handler
  - helper
  - impl
  - integration
  - manager
  - mock
  - model
  - owner
  - processor
  - repository
  - runtime
  - scope
  - service
  - smoke
  - state
  - types
  - utils
  - workflow
  qualifiers:
    policy: true
    host:
    - server
    - worker
    - browser
    transport:
    - http
    - webhook
    - cli
    - consumer
    - websocket
    - sse
    implementation:
    - memory
    - postgres
    - generated
    - live
    - fake
    provider: true
syntax:
  segment_case: kebab-case
  segment_separator: .
  order:
  - product-subject
  - facet-or-operation
  - responsibility
  - implementation-qualifier
  typical_semantic_segments: 2-4
  review_over_semantic_segments: 5
  note: Dots compress local semantics; they do not create isolation or authority.
canonical_terms:
  command:
    category: responsibility
    owner: evolvable-application-architecture
    means: Authoritative intent requesting a controlled state transition.
    does_not_mean:
    - an accepted fact
    - an arbitrary function call
  command-context:
    category: responsibility
    owner: evolvable-application-architecture
    means: Explicit actor, correlation, request, time, deadline, and authorization context carried into a controlled command path.
    does_not_mean:
    - ambient process-global context
    - unvalidated transport request
  query:
    category: responsibility
    owner: evolvable-application-architecture
    means: A read of an authoritative projection or state without creating accepted facts.
    does_not_mean:
    - a mutation hidden behind a read name
  use-case:
    category: responsibility
    owner: evolvable-application-architecture
    means: A controlled application path that authorizes, validates, transitions, and may commit accepted facts.
    does_not_mean:
    - generic service
    - transport handler
  policy:
    category: responsibility
    owner: evolvable-application-architecture
    means: Pure or explicitly contextual decision logic.
    does_not_mean:
    - database or transport orchestration
  projection:
    category: responsibility
    owner: evolvable-application-architecture
    means: A read-oriented representation derived after accepted commit.
    does_not_mean:
    - the materialization authority
    - optimistic local proposal
  port:
    category: responsibility
    owner: evolvable-application-architecture
    means: Application-owned contract for a genuine outer capability or replaceable boundary.
    does_not_mean:
    - an interface for every class
  repository:
    category: capability
    owner: evolvable-application-architecture
    means: Application-owned persistence capability for one bounded subject, expressed through explicit transaction and concurrency semantics.
    does_not_mean:
    - generic base repository for every object
    - permission for callers to bypass a use case
  transaction:
    category: persistence
    owner: evolvable-application-architecture
    means: Atomic consistency boundary that commits accepted facts and required durable side records together.
    does_not_mean:
    - payment attempt
    - cross-module workflow
    - long-running external effect
  idempotency:
    category: persistence
    owner: evolvable-application-architecture
    means: Durable command/effect identity and replay behavior preventing duplicate accepted transitions at the declared boundary.
    does_not_mean:
    - provider exactly-once execution
    - best-effort in-memory dedupe
  contract:
    category: responsibility
    owner: evolvable-application-architecture
    means: Stable cross-boundary or public shape with explicit compatibility expectations.
    does_not_mean:
    - an execution-method contract, product contract, or suite coordination contract without an explicit qualifier
    - all local types
  schema:
    category: responsibility
    owner: evolvable-application-architecture
    means: Runtime-decodable shape for untrusted or wire data.
    does_not_mean:
    - domain truth by itself
  mapper:
    category: responsibility
    owner: evolvable-application-architecture
    means: Pure conversion between explicitly named representations.
    does_not_mean:
    - business decision hiding in conversion
  public:
    category: boundary
    owner: evolvable-application-architecture
    means: Ordinary cross-module collaboration surface.
    does_not_mean:
    - host-only implementations
    - wildcard barrel
  wiring:
    category: boundary
    owner: evolvable-application-architecture
    means: Host composition surface exposing constructors, live layers, or adapter factories.
    does_not_mean:
    - business module API
  composition:
    category: host
    owner: evolvable-application-architecture
    means: Assembly of selected implementations and resource graphs at an owned host boundary.
    does_not_mean:
    - product transition logic
  migration:
    category: evolution
    owner: evolvable-application-architecture
    means: Forward data or contract transformation with explicit source, target, and deletion/rollback limits.
    does_not_mean:
    - permanent compatibility bridge
  client:
    category: frontend
    owner: frontend-architecture
    means: Typed product capability gateway or facade, separate from React/query/store/view concerns.
    does_not_mean:
    - giant application service
  store:
    category: frontend
    owner: frontend-architecture
    means: Owner of local interaction state.
    does_not_mean:
    - remote projection mirror
  realtime:
    category: frontend
    owner: frontend-architecture
    means: Typed projection continuity, dedupe, gap detection, and reconciliation logic.
    does_not_mean:
    - transport construction
    - business authority
  view-model:
    category: frontend
    owner: frontend-architecture
    means: Pure combination of projection and local interaction for a surface.
    does_not_mean:
    - wire DTO
    - global state owner
  page:
    category: frontend
    owner: frontend-architecture
    means: Route/page container glue for feature capabilities.
    does_not_mean:
    - feature business core
  surface:
    category: frontend
    owner: frontend-architecture
    means: Harnessable UI boundary consuming a view model and callbacks.
    does_not_mean:
    - final visual approval by itself
  live:
    category: runtime
    owner: effect-best-practices
    means: A real runtime implementation selected by wiring/composition.
    does_not_mean:
    - currently enabled
    - proof of production equivalence
  fake:
    category: harness
    owner: product-harness-system
    means: Deterministic behavioral replacement used through an explicit proof or test boundary.
    does_not_mean:
    - static fixture
    - silent production fallback
  layer:
    category: runtime
    owner: effect-best-practices
    means: Effect dependency/resource construction value.
    does_not_mean:
    - business authority graph
  runtime:
    category: runtime
    owner: effect-best-practices
    means: Owned execution environment for a closed Effect dependency graph.
    does_not_mean:
    - process-global default singleton
  scope:
    category: runtime
    owner: effect-best-practices
    means: Lifetime boundary pairing acquisition and release.
    does_not_mean:
    - business transaction
  scenario:
    category: harness
    owner: product-harness-system
    means: Bounded semantic proof story for a product capability.
    does_not_mean:
    - a low-level selector script
  fixture:
    category: harness
    owner: product-harness-system
    means: Static deterministic input or seed material.
    does_not_mean:
    - mutable fake behavior
    - real business fact
  replay:
    category: harness
    owner: product-harness-system
    means: Recorded and normalized input sequence executed again against a stated boundary.
    does_not_mean:
    - the source authority
  driver:
    category: harness
    owner: product-harness-system
    means: Reusable action issuer for a formal command, interface, or transport boundary.
    does_not_mean:
    - business transition implementation
  probe:
    category: harness
    owner: product-harness-system
    means: Read-only observer of outputs, state, resources, or diagnostics.
    does_not_mean:
    - a hidden writer
  harness:
    category: harness
    owner: product-harness-system
    means: Runnable, observable proof surface combining the minimum roles needed for a bounded claim.
    does_not_mean:
    - a second product architecture
    - agent loop controller
  result:
    category: harness
    owner: product-harness-system
    means: Structured observation and bounded interpretation emitted by a harness run.
    does_not_mean:
    - automatic proof of unrelated surfaces
canonical_qualifiers:
  policy: Existing canonical qualifier first; a new durable qualifier is project-registered the first time it becomes part of a stable filename pattern.
  host:
  - browser
  - server
  - worker
  transport:
  - http
  - webhook
  - websocket
  - sse
  - cli
  - consumer
  implementation:
  - live
  - fake
  - memory
  - postgres
  - generated
  provider: Project-defined and registered under implementation_qualifiers, for example stripe or openai.
filename_patterns:
- id: application-command
  pattern: <subject>.<operation>.command.ts
  owner: evolvable-application-architecture
- id: application-command-context
  pattern: <subject>.command-context.ts
  owner: evolvable-application-architecture
- id: application-use-case
  pattern: <subject>.<operation>.use-case.ts
  owner: evolvable-application-architecture
- id: application-query
  pattern: <subject>.<read-purpose>.query.ts
  owner: evolvable-application-architecture
- id: application-port
  pattern: <subject>.<capability>.port.ts
  owner: evolvable-application-architecture
- id: transaction-port
  pattern: <subject>.transaction.port.ts
  owner: evolvable-application-architecture
- id: idempotency-port
  pattern: <subject>.idempotency.port.ts
  owner: evolvable-application-architecture
- id: adapter-live
  pattern: <subject>.<capability>.<provider>.live.ts
  owner: effect-best-practices
- id: adapter-fake
  pattern: <subject>.<capability>.memory.fake.ts
  owner: effect-best-practices
- id: module-public
  pattern: <subject>.public.ts
  owner: evolvable-application-architecture
- id: module-wiring
  pattern: <subject>.wiring.ts
  owner: evolvable-application-architecture
- id: http-contract
  pattern: <subject>.http.contract.ts
  owner: evolvable-application-architecture
- id: http-handlers
  pattern: <subject>.http.handlers.ts
  owner: evolvable-application-architecture
- id: frontend-client
  pattern: <subject>.client.ts
  owner: frontend-architecture
- id: frontend-query
  pattern: <subject>.query.ts
  owner: frontend-architecture
- id: frontend-store
  pattern: <subject>.store.ts
  owner: frontend-architecture
- id: frontend-realtime
  pattern: <subject>.realtime.ts
  owner: frontend-architecture
- id: frontend-view-model
  pattern: <subject>.view-model.ts
  owner: frontend-architecture
- id: frontend-surface
  pattern: <subject>.surface.tsx
  owner: frontend-architecture
directory_admission:
- distinct capability or authority owner
- different public/private dependency policy
- independent resource lifecycle or composition
- can be replaced, tested, migrated, or promoted as a unit
- framework/tooling requires the directory
- stable high-density lexical cluster has emerged
promotion_ladder:
- lexical capability cluster
- private submodule
- workspace package
- deployable process
guarded_terms:
  authority:
    questions:
    - Does this mean fact authority, product decision authority, documentation authority, execution authority, or policy authority?
    - Which claim and decision surface does the owner control?
  accepted:
    questions:
    - Product target, document lifecycle, Harness reuse status, execution completion, or release acceptance?
    - Which owner performed the acceptance and for what scope?
  owner:
    questions:
    - Semantic owner, binding-policy owner, state owner, resource owner, execution owner, or file maintainer?
  repository:
    questions:
    - Version-control repository/workspace, persistence Repository capability, or package/source home?
  state:
    questions:
    - Product lifecycle state, authoritative fact, remote projection, local interaction state, runtime state, or execution status?
  workflow:
    questions:
    - Product/business workflow, cross-capability application orchestration, or selected execution method?
  runtime:
    questions:
    - Effect Runtime, process/host, deployment environment, or the currently observed system?
  scope:
    questions:
    - Product/version scope, claim scope, permission/data scope, or Effect resource lifetime Scope?
  contract:
    questions:
    - Is this an API contract, execution-method contract, product contract, suite coordination contract, or a local type?
  model:
    questions:
    - Is this a domain model, product model, persistence model, view model, or model-provider integration?
  service:
    questions:
    - Is this a use-case, port, client, policy, workflow, or Effect Service key?
    allowed_when:
    - an established external/framework contract uses the term
    - a genuine Effect Service key is intentionally exposed
  manager:
    questions:
    - What resource, authority, or lifecycle does it actually own?
  helper:
    questions:
    - Can the product subject and pure responsibility be named?
  utils:
    questions:
    - Is there one narrow coherent public API?
    - Would mapper, decoder, policy, fixture, or testkit be more precise?
  common:
    questions:
    - Which named capability owns this?
  core:
    questions:
    - Is this a tiny stable kernel or a dependency magnet?
  base:
    questions:
    - Is inheritance actually required?
  types:
    replacement_candidates:
    - model
    - contract
    - schema
    - projection
    - errors
  adapter:
    questions:
    - Which capability and provider/transport does it adapt?
  impl:
    questions:
    - Can live/fake/provider/host express the variant?
  api:
    questions:
    - Does this mean product contract, HTTP transport, public module surface, or vendor API?
  processor:
    questions:
    - Is this a use-case, workflow, worker, consumer, or policy?
  controller:
    questions:
    - Is this framework-required transport code? Keep it thin and subject-qualified.
  handler:
    allowed_patterns:
    - <subject>.http.handlers.ts
    - <subject>.webhook.handlers.ts
    forbidden_patterns:
    - handler.ts
    - handlers.ts
  mock:
    questions:
    - Is this a fixture, fake, stub, spy, or emulated server?
  smoke:
    questions:
    - What exact capability and claim ceiling does it exercise?
  e2e:
    questions:
    - Name the actual endpoints and real/fake boundaries.
  integration:
    questions:
    - Which concrete boundaries are integrated?
  done:
    questions:
    - Command completion, scenario pass, product completion, or release completion?
  complete:
    questions:
    - Which claim and observed surfaces justify this term?
project_terms:
  order:
    status: canonical
    product_term: Order
    source_token: order
    kind: authority
    meaning_ref: ../ssot/product-language.md
    aliases:
      purchase:
        status: forbidden
        reason: Order 是当前 canonical product term
  checkout:
    status: canonical
    product_term: Checkout
    source_token: checkout
    kind: workflow
    meaning_ref: ../ssot/product-language.md
    aliases: {}
  payment-attempt:
    status: canonical
    product_term: PaymentAttempt
    source_token: payment-attempt
    kind: authority
    meaning_ref: ../ssot/product-language.md
    aliases:
      transaction:
        status: forbidden
        reason: transaction 保留给数据库事务语义
implementation_qualifiers:
  stripe:
    kind: provider
    capability: payment-gateway
deprecated_terms:
  repo:
    replacement: repository
    status: forbidden-new-use
