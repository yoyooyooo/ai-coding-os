id: rust
version: 1
requires:
  - application-core
provides:
  - Rust module visibility and facade guidance
  - pressure-driven module to crate to binary promotion
  - application-owned capability trait guidance
  - generic versus dyn dispatch decision inputs
  - async task cancellation shutdown and resource ownership guidance
  - Serde wire persistence and domain type separation
  - public API SemVer MSRV and Cargo feature evolution guidance
rules:
  - Rust ownership and borrowing do not prove product fact authority or durable single-writer behavior
  - do not create a trait or crate without real replacement compilation ownership or lifecycle pressure
  - binary and host composition own selected adapters and graceful shutdown
  - cargo test and successful compilation do not prove real-adapter restart migration or runtime behavior
