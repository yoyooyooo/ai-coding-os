id: monorepo-core
version: 2
requires:
  - application-core
provides:
  - workspace repository topology for apps packages tooling docs and specs
  - package and deployable promotion guidance for monorepositories
  - one root documentation knowledge network with local routes
rules:
  - repository package deployable authority and data boundaries are distinct
  - package sharing does not grant fact authority
  - apps packages and tooling are project topology choices not cross-language doctrine
  - unused docs layers may be omitted and child partitions require durable pressure
