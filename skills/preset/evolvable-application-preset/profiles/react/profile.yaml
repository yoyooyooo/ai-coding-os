id: react
version: 1
requires:
  - typescript-node
suite_contract:
  term_owners:
    - frontend-architecture
  filename_pattern_owners:
    - frontend-architecture
  qualifiers:
    host: [browser]
    transport: [http, websocket, sse]
provides:
  - client/query/store/realtime/view-model/page/surface vocabulary
  - feature and host composition defaults
rules:
  - remote projection has one owner and is not mirrored into local store
  - components render and dispatch; host roots construct live resources
