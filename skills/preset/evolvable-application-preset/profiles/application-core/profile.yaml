id: application-core
version: 1
suite_contract:
  term_owners:
    - evolvable-application-architecture
  guarded_terms:
    - accepted
    - authority
    - contract
    - model
    - owner
    - repository
    - state
    - workflow
    - adapter
    - api
    - handler
    - unknown
    - confidence
    - ready
    - resolved
    - blocked
    - assumption
    - health
  qualifiers:
    policy: true
    host: [browser, server, worker]
    transport: [http, webhook, cli, consumer]
    implementation: [memory, postgres, generated]
    provider: true
provides:
  - authority-first application architecture vocabulary
  - private semantic boundary first
  - pressure-driven boundary promotion
  - use-case capability composition evolution and evidence defaults
rules:
  - memory ownership package ownership and fact authority remain distinct
  - ordinary architecture choices stay with the architecture owner after product constraints settle
  - boundary strength is earned by visibility compilation lifecycle trust or deployment pressure
  - no ecosystem file layout is implied by this profile
