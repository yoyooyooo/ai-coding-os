id: verification-core
version: 1
suite_contract:
  term_owners:
    - product-harness-system
  guarded_terms:
    - mock
    - smoke
    - e2e
    - integration
    - done
    - complete
  qualifiers:
    implementation: [fake]
provides:
  - Harness Descriptor and Harness Result conventions
  - verify list/affected/full command slots
  - fake replay real environment labels
  - observation/support/not-proven reporting
rules:
  - Harness is not product authority or Agent loop controller
  - Agent may select any sufficient proof surface directly
