id: typescript-node
version: 2
requires:
  - application-core
suite_contract:
  filename_pattern_owners:
    - evolvable-application-architecture
provides:
  - TypeScript semantic filename patterns
  - public and wiring import guidance
  - package exports and deep-import checks when packages exist
  - host entrypoint naming
rules:
  - use-case and policy do not import live infrastructure
  - package does not import app internals when a package boundary exists
  - selecting TypeScript does not select a monorepo
