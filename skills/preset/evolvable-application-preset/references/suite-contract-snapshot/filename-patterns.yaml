directory_admission:
- distinct capability or authority owner
- different public/private dependency policy
- independent resource lifecycle or composition
- can be replaced, tested, migrated, or promoted as a unit
- framework/tooling requires the directory
- stable high-density lexical cluster has emerged
promotion_ladder:
- lexical capability cluster
- private TypeScript module/directory
- workspace package when selected
- runnable host
- deployable process
scope: typescript-and-frontend-source-projections
note: These patterns are selected only by TypeScript/React/Effect profiles; they are
  not cross-language architecture doctrine.
