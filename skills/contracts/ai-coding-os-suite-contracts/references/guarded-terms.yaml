schema_version: 1
terms:
  authority:
    questions:
    - Does this mean fact authority, product decision authority, documentation authority,
      execution authority, or policy authority?
    - Which claim and decision surface does the owner control?
  accepted:
    questions:
    - Product target, document lifecycle, Harness reuse status, execution completion,
      or release acceptance?
    - Which owner performed the acceptance and for what scope?
  owner:
    questions:
    - Semantic owner, binding-policy owner, state owner, resource owner, execution
      owner, or file maintainer?
  repository:
    questions:
    - Version-control repository/workspace, persistence Repository capability, or
      package/source home?
  state:
    questions:
    - Product lifecycle state, authoritative fact, remote projection, local interaction
      state, runtime state, or execution status?
  workflow:
    questions:
    - Product/business workflow, cross-capability application orchestration, or selected
      execution method?
  runtime:
    questions:
    - Effect Runtime, process/host, deployment environment, or the currently observed
      system?
  scope:
    questions:
    - Product/version scope, claim scope, permission/data scope, or Effect resource
      lifetime Scope?
  contract:
    questions:
    - Is this an API contract, execution-method contract, product contract, suite
      coordination contract, or a local type?
  model:
    questions:
    - Is this a domain model, product model, persistence model, view model, or model-provider
      integration?
  service:
    questions:
    - Is this a use-case, port, client, policy, workflow, or Effect Service key?
    allowed_when:
    - an established external/framework contract uses the term
    - a genuine Effect Service key is intentionally exposed
  manager:
    questions:
    - What resource, authority, or lifecycle does it actually own?
  helper:
    questions:
    - Can the product subject and pure responsibility be named?
  utils:
    questions:
    - Is there one narrow coherent public API?
    - Would mapper, decoder, policy, fixture, or testkit be more precise?
  common:
    questions:
    - Which named capability owns this?
  core:
    questions:
    - Is this a tiny stable kernel or a dependency magnet?
  base:
    questions:
    - Is inheritance actually required?
  types:
    replacement_candidates:
    - model
    - contract
    - schema
    - projection
    - errors
  adapter:
    questions:
    - Which capability and provider/transport does it adapt?
  impl:
    questions:
    - Can live/fake/provider/host express the variant?
  api:
    questions:
    - Does this mean product contract, HTTP transport, public module surface, or vendor
      API?
  processor:
    questions:
    - Is this a use-case, workflow, worker, consumer, or policy?
  controller:
    questions:
    - Is this framework-required transport code? Keep it thin and subject-qualified.
  handler:
    allowed_patterns:
    - <subject>.http.handlers.ts
    - <subject>.webhook.handlers.ts
    forbidden_patterns:
    - handler.ts
    - handlers.ts
  mock:
    questions:
    - Is this a fixture, fake, stub, spy, or emulated server?
  smoke:
    questions:
    - What exact capability and claim ceiling does it exercise?
  e2e:
    questions:
    - Name the actual endpoints and real/fake boundaries.
  integration:
    questions:
    - Which concrete boundaries are integrated?
  done:
    questions:
    - Command completion, scenario pass, product completion, or release completion?
  complete:
    questions:
    - Which claim and observed surfaces justify this term?
  unknown:
    questions:
    - Unknown to whom and about which claim?
    - Would different answers materially change product meaning, Authority, durable
      data, public compatibility, or irreversible behavior?
    - Is it semantic, architectural, empirical, environmental, or external-policy?
  confidence:
    questions:
    - 'What is the basis: accepted decision, source observation, execution evidence,
      inference, or model self-report?'
    - Which claim remains not_proven?
  ready:
    questions:
    - Ready for exploration, reversible implementation, commitment, claim, release,
      or production?
    - Which residual unknowns and stop lines remain?
  resolved:
    questions:
    - Resolved by which owner, for which scope and version?
    - Were affected Current Homes and claims updated?
  blocked:
    questions:
    - Which exact claim or commitment is blocked?
    - What unaffected work may continue?
  assumption:
    questions:
    - Who owns it, what is its scope, and when does it expire or invalidate?
    - Which commitment may it not cross?
  health:
    questions:
    - Which dimensions and evidence basis are evaluated?
    - Is this a point-in-time derived finding or an unsupported scalar score?
  claim:
    questions:
    - What exact proposition, scope, temporal plane, and owner are intended?
    - What proof surface supports it and what remains not_proven?
