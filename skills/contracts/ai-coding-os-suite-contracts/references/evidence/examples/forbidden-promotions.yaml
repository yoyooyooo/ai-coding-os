schema_version: 1
cases:
  - id: harness-pass-is-not-execution-complete
    invalid_inference: A passing Harness Result completes the selected execution method.
    required_treatment: Preserve the Harness claim ceiling and let the selected method assess local sufficiency.
  - id: harness-not-proven-is-not-execution-exclusion
    invalid_inference: Harness not_proven means the selected execution method excludes the claim.
    required_treatment: Keep missing proof separate from an explicit scope or claim exclusion.
  - id: accepted-target-is-not-verified-implementation
    invalid_inference: An accepted product target proves implementation or release.
    required_treatment: Keep delivery evidence not-proven until the owning proof exists.
  - id: observed-behavior-is-not-future-intent
    invalid_inference: Observed runtime behavior becomes accepted future product intent.
    required_treatment: Keep bounded observation separate from product acceptance; source-only implementation claims remain source-derived.
  - id: execution-status-is-not-product-or-doc-acceptance
    invalid_inference: A done ticket, execution-method item, workflow, or release task accepts product intent or documentation lifecycle.
    required_treatment: Keep execution status with its owner and require product/document authority decisions.
  - id: docs-evidence-is-not-document-acceptance
    invalid_inference: A verified or released evidence label accepts the documentation artifact.
    required_treatment: Keep evidence level orthogonal to document lifecycle and documentation authority.
