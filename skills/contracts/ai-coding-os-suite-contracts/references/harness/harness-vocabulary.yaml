schema_version: 2
terms:
  scenario: bounded semantic proof story
  fixture: static deterministic input or seed
  fake: deterministic behavioral replacement
  replay: recorded normalized input sequence
  driver: action issuer through a formal boundary
  probe: read-only observer
  harness: runnable observable verification surface
  observed: direct result from the executed path
  supports: bounded interpretation justified by observations and repository authority
  not_proven: property that may matter but was not exercised
  claim_ceiling: descriptive maximum supported by the exercised surface, not an Agent permission gate
proof_axes:
  surface_kind:
    - headless
    - interface_headless
    - render
    - browser
    - external_runtime
  dependency_reality:
    - none
    - fixture
    - fake
    - replay
    - real_local
    - real_external
  environment_class:
    - isolated
    - local_process
    - local_stack
    - staging
    - production
  proof_focus: owner-local snake_case labels such as render_wiring or persistence_restart
principles:
  - harness does not become product authority
  - agent chooses proof depth
  - observation surface and dependency reality remain orthogonal
  - observations and conclusions remain distinguishable
